<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">MusDawc local audio workshop and cassette workflow</title>
  <desc id="desc">Illustrated overview of MusDawc: import a recording, shape it in the timeline, then keep it in the temporary cassette case or export a mix.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#211c18"/><stop offset="1" stop-color="#35271f"/></linearGradient>
    <linearGradient id="deck" x2="0" y2="1"><stop stop-color="#f5ecd9"/><stop offset="1" stop-color="#d9c8aa"/></linearGradient>
    <linearGradient id="wood" x2="1" y2="1"><stop stop-color="#8b6042"/><stop offset=".5" stop-color="#4c3226"/><stop offset="1" stop-color="#906344"/></linearGradient>
    <linearGradient id="tape" x2="0" y2="1"><stop stop-color="#eee2c7"/><stop offset="1" stop-color="#b8a985"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#080605" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1440" height="960" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="300" fill="#b67645" opacity=".08"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(74 38)">
      <rect width="35" height="25" rx="6" fill="none" stroke="#cf8055" stroke-width="2"/><circle cx="11" cy="15" r="4" fill="none" stroke="#e7ba8b" stroke-width="2"/><circle cx="24" cy="15" r="4" fill="none" stroke="#e7ba8b" stroke-width="2"/>
      <text x="49" y="18" fill="#eee4d5" font-size="21" font-weight="700">MusDawc</text><text x="49" y="38" fill="#c3a982" font-family="monospace" font-size="9" letter-spacing="2">YOUR PRIVATE AUDIO WORKSHOP</text>
      <text x="1044" y="17" fill="#bcb09d" font-family="monospace" font-size="10" letter-spacing="1">● LOCAL · NO AUDIO UPLOAD</text>
    </g>
    <text x="74" y="127" fill="#bda782" font-family="monospace" font-size="11" letter-spacing="2">LISTEN · SHAPE · KEEP</text>
    <text x="74" y="168" fill="#eee4d5" font-family="Georgia, serif" font-size="35">A little room for <tspan fill="#e7a86e" font-style="italic">your sound.</tspan></text>
    <g filter="url(#shadow)">
      <rect x="74" y="198" width="1292" height="247" rx="16" fill="url(#deck)" stroke="#fff" stroke-opacity=".28"/>
      <text x="101" y="228" fill="#665640" font-family="monospace" font-size="10" letter-spacing="1.6">MUSDAWC · ANALOG PLAYBACK DECK</text>
      <circle cx="1328" cy="224" r="5" fill="#789060"/><text x="1309" y="242" fill="#837158" font-family="monospace" font-size="8" text-anchor="end">READY</text>
      <rect x="109" y="249" width="665" height="153" rx="12" fill="#302b25" stroke="#76664d"/>
      <rect x="126" y="263" width="631" height="47" rx="4" fill="#e9ddc0"/>
      <path d="M126 274H757M126 286H757M126 298H757" stroke="#bca782" stroke-opacity=".5"/>
      <text x="146" y="282" fill="#554633" font-family="Georgia, serif" font-size="18" font-style="italic">Evening raga — alap take</text>
      <text x="146" y="301" fill="#806c4e" font-family="monospace" font-size="8" letter-spacing="1">SIDE A · PERSONAL PRACTICE</text>
      <rect x="126" y="318" width="631" height="69" rx="30" fill="#171614" stroke="#816e4d"/>
      <circle cx="294" cy="352" r="28" fill="#514536" stroke="#ad9364" stroke-width="4"/><circle cx="294" cy="352" r="9" fill="#cdb98c"/>
      <circle cx="588" cy="352" r="28" fill="#514536" stroke="#ad9364" stroke-width="4"/><circle cx="588" cy="352" r="9" fill="#cdb98c"/>
      <path d="M322 352H560" stroke="#c3a16b" stroke-width="3"/>
      <g transform="translate(820 257)"><text fill="#6b5b43" font-family="monospace" font-size="9" letter-spacing="1">TAPE COUNTER</text><rect y="16" width="350" height="54" rx="5" fill="#252821" stroke="#70634c" stroke-width="5"/><text x="175" y="55" fill="#b3d18b" font-family="monospace" font-size="31" text-anchor="middle">03:42<tspan font-size="13">.8</tspan></text><text x="4" y="91" fill="#75684f" font-family="monospace" font-size="9">L</text><rect x="20" y="82" width="145" height="9" rx="3" fill="#25251f" stroke="#75664e"/><rect x="21" y="83" width="101" height="7" rx="2" fill="#799665"/><text x="180" y="91" fill="#75684f" font-family="monospace" font-size="9">R</text><rect x="196" y="82" width="145" height="9" rx="3" fill="#25251f" stroke="#75664e"/><rect x="197" y="83" width="117" height="7" rx="2" fill="#bc9453"/></g>
      <path d="M109 414H1331" stroke="#9c8a6b" stroke-opacity=".5"/>
      <g transform="translate(112 422)" fill="#62533d" font-family="monospace" font-size="8" letter-spacing=".8"><text x="0">⏮ REW</text><text x="100">■ STOP</text><text x="206" fill="#26736b">▶ PLAY</text><text x="320" fill="#bf4634">● REC</text><text x="1015">PERSONAL STUDIO</text></g>
    </g>
    <g filter="url(#shadow)">
      <rect x="74" y="467" width="1292" height="178" rx="12" fill="#f0e6d2"/>
      <text x="101" y="500" fill="#8d7658" font-family="monospace" font-size="9" letter-spacing="1.4">EDIT WITHOUT LOSING YOUR ORIGINAL</text>
      <text x="101" y="526" fill="#3b3024" font-family="Georgia, serif" font-size="21">Timeline editor</text>
