    </g>
    <g filter="url(#shadow)">
      <rect x="74" y="667" width="815" height="235" rx="12" fill="#eee3ce"/>
      <text x="101" y="701" fill="#8d7658" font-family="monospace" font-size="9" letter-spacing="1.3">A TEMPORARY HOME FOR YOUR AUDIO</text><text x="101" y="728" fill="#3b3024" font-family="Georgia, serif" font-size="21">Cassette case</text>
      <rect x="101" y="747" width="760" height="128" rx="9" fill="url(#wood)" stroke="#35251e"/>
      <text x="119" y="766" fill="#d0ad7e" font-family="monospace" font-size="7" letter-spacing="1.1">YOUR PERSONAL TAPE LIBRARY</text>
      <rect x="112" y="777" width="738" height="77" rx="5" fill="#2c231e" stroke="#291d18"/>
      <g transform="translate(127 784)">
        <g><rect width="186" height="60" rx="6" fill="url(#tape)" stroke="#5c4c38"/><rect x="8" y="7" width="170" height="17" rx="2" fill="#eee4ca"/><text x="14" y="19" fill="#514331" font-size="8" font-weight="700">Evening raga — alap take</text><rect x="26" y="29" width="134" height="23" rx="7" fill="#29231e" stroke="#766447"/><circle cx="61" cy="40" r="8" fill="#383027" stroke="#c7aa76" stroke-width="3"/><circle cx="125" cy="40" r="8" fill="#383027" stroke="#c7aa76" stroke-width="3"/><path d="M70 40H116" stroke="#c7aa76" stroke-width="2"/></g>
        <g transform="translate(199 0)"><rect width="186" height="60" rx="6" fill="#bdc8ad" stroke="#4e513e"/><rect x="8" y="7" width="170" height="17" rx="2" fill="#e5e4cd"/><text x="14" y="19" fill="#514331" font-size="8" font-weight="700">Voice memo</text><rect x="26" y="29" width="134" height="23" rx="7" fill="#29231e" stroke="#766447"/><circle cx="61" cy="40" r="8" fill="#383027" stroke="#91b5a2" stroke-width="3"/><circle cx="125" cy="40" r="8" fill="#383027" stroke="#91b5a2" stroke-width="3"/><path d="M70 40H116" stroke="#91b5a2" stroke-width="2"/></g>
        <path d="M401 30h24" stroke="#e3b873" stroke-width="2"/><path d="m420 24 7 6-7 6" fill="none" stroke="#e3b873" stroke-width="2"/>
        <text x="437" y="27" fill="#ead8b7" font-family="monospace" font-size="8" letter-spacing=".7">DROP AUDIO</text><text x="437" y="41" fill="#b19b7e" font-size="8">or browse to add tapes</text>
      </g>
      <text x="118" y="869" fill="#d2b48b" font-family="monospace" font-size="7" letter-spacing="1">MusDawc · TAPE CASE</text><text x="833" y="869" fill="#d2b48b" font-family="monospace" font-size="7" text-anchor="end" letter-spacing="1">CLICK A TAPE TO OPEN &amp; EDIT</text>
    </g>
    <g filter="url(#shadow)"><rect x="914" y="667" width="452" height="235" rx="12" fill="#eee3ce"/><text x="943" y="701" fill="#8d7658" font-family="monospace" font-size="9" letter-spacing="1.3">YOUR WORKFLOW</text><text x="943" y="728" fill="#3b3024" font-family="Georgia, serif" font-size="21">A few simple moves</text>
      <g transform="translate(943 752)"><circle cx="15" cy="15" r="14" fill="#3d7168"/><text x="15" y="19" fill="#fff2d8" text-anchor="middle" font-size="11" font-weight="700">1</text><text x="43" y="13" fill="#4c3c2a" font-size="12" font-weight="700">Bring in a recording</text><text x="43" y="29" fill="#817158" font-size="9">Drop it in the case or open it directly.</text>
      <circle cx="15" cy="64" r="14" fill="#bd7654"/><text x="15" y="68" fill="#fff2d8" text-anchor="middle" font-size="11" font-weight="700">2</text><text x="43" y="62" fill="#4c3c2a" font-size="12" font-weight="700">Shape the take</text><text x="43" y="78" fill="#817158" font-size="9">Trim, split, fade, pan, and arrange.</text>
      <circle cx="15" cy="113" r="14" fill="#b88c4c"/><text x="15" y="117" fill="#fff2d8" text-anchor="middle" font-size="11" font-weight="700">3</text><text x="43" y="111" fill="#4c3c2a" font-size="12" font-weight="700">Keep or export</text><text x="43" y="127" fill="#817158" font-size="9">Make a WAV mix or a ZIP collection.</text></g>
    </g>
    <text x="74" y="933" fill="#bca886" font-family="monospace" font-size="9" letter-spacing="1.3">LOCAL AUDIO · NO ACCOUNT · NO TRACKING</text><text x="1366" y="933" fill="#bca886" font-family="monospace" font-size="9" text-anchor="end" letter-spacing="1.3">MADE FOR LISTENING, MADE TO STAY YOURS</text>
  </g>
</svg>
